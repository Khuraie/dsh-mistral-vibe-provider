<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mistral Vibe for DeepSeek Harness">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="0.55" stop-color="#FF3D00"/>
      <stop offset="1" stop-color="#B1004B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="0.55" stop-color="#FF3D00" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#B1004B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#FF3D00" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#B1004B" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0B0B0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242433"/>
      <stop offset="1" stop-color="#161625"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0B0B0F"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <svg x="80" y="92" width="116" height="116" viewBox="0 0 240 240">
    <rect width="240" height="240" fill="url(#iconbg)"/>
    <g shape-rendering="crispEdges">
      <rect x="63" y="63" width="23" height="23" fill="#ffaf01"/>
      <rect x="155" y="63" width="23" height="23" fill="#ffaf01"/>
      <rect x="63" y="86" width="23" height="23" fill="#ff8204"/>
      <rect x="86" y="86" width="23" height="23" fill="#ff8204"/>
      <rect x="132" y="86" width="23" height="23" fill="#ff8204"/>
      <rect x="155" y="86" width="23" height="23" fill="#ff8204"/>
      <rect x="63" y="109" width="23" height="23" fill="#fa500f"/>
      <rect x="86" y="109" width="23" height="23" fill="#fa500f"/>
      <rect x="109" y="109" width="23" height="23" fill="#fa500f"/>
      <rect x="132" y="109" width="23" height="23" fill="#fa500f"/>
      <rect x="155" y="109" width="23" height="23" fill="#fa500f"/>
      <rect x="63" y="132" width="23" height="23" fill="#e51300"/>
      <rect x="109" y="132" width="23" height="23" fill="#e51300"/>
      <rect x="155" y="132" width="23" height="23" fill="#e51300"/>
      <rect x="40" y="155" width="23" height="23" fill="#c4001d"/>
      <rect x="63" y="155" width="23" height="23" fill="#c4001d"/>
      <rect x="86" y="155" width="23" height="23" fill="#c4001d"/>
      <rect x="132" y="155" width="23" height="23" fill="#c4001d"/>
      <rect x="155" y="155" width="23" height="23" fill="#c4001d"/>
      <rect x="178" y="155" width="23" height="23" fill="#c4001d"/>
    </g>
  </svg>

  <text x="228" y="142" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F7F4EF">Mistral Vibe</text>
  <text x="230" y="188" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#9B9BA8">for DeepSeek Harness</text>
  <rect x="230" y="208" width="370" height="3" rx="1.5" fill="url(#rule)"/>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#C9C9D4">
    <g transform="translate(230 232)">
      <rect width="152" height="34" rx="17" fill="#17171D" stroke="#2A2A34"/>
      <text x="76" y="23" text-anchor="middle">Vibe Code route</text>
    </g>
    <g transform="translate(394 232)">
      <rect width="132" height="34" rx="17" fill="#17171D" stroke="#2A2A34"/>
      <text x="66" y="23" text-anchor="middle">PKCE sign-in</text>
    </g>
    <g transform="translate(538 232)">
      <rect width="136" height="34" rx="17" fill="#17171D" stroke="#2A2A34"/>
