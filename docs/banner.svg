  </g>

  <text x="228" y="142" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F7F4EF">Mistral Vibe</text>
  <text x="230" y="188" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#9B9BA8">for DeepSeek Harness</text>
